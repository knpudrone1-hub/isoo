<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#ff6b9c">
    <title>이수의 수학친구 키티</title>
    <link rel="stylesheet" href="style_isoo.css?v=10">
    <link rel="manifest" href="manifest_isoo.json">
    <link rel="apple-touch-icon" href="kitty_app_icon.png">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <img src="kitty_planner_header.png" alt="" class="brand-kitty">
                <div>
                    <p class="eyebrow">초등 수학 챗봇</p>
                    <h1>이수의 수학친구 키티</h1>
                </div>
            </div>
            <div class="top-actions">
                <span id="api-status" class="status-chip">API 키 필요</span>
                <button id="clear-chat-btn" class="ghost-button" type="button">대화 지우기</button>
            </div>
        </header>

        <main class="workspace">
            <section class="chat-area" aria-label="키티와 수학 대화">
                <div id="messages" class="messages" aria-live="polite"></div>

                <form id="chat-form" class="composer">
                    <div id="attachment-preview" class="attachment-preview" hidden></div>
                    <textarea id="user-input" rows="1" maxlength="900" placeholder="키티야 또는 수학 문제를 입력하세요"></textarea>
                    <div class="composer-actions">
                        <input id="image-input" type="file" accept="image/*" multiple hidden>
                        <label class="tool-button" for="image-input">사진</label>
                        <button id="voice-btn" class="tool-button" type="button">말하기</button>
                        <button id="speech-toggle" class="tool-button" type="button">소리 켜짐</button>
                        <button id="send-btn" class="send-button" type="submit">보내기</button>
                    </div>
                    <p id="voice-status" class="voice-status" aria-live="polite">말하기 버튼을 눌러 음성 입력을 테스트할 수 있어요.</p>
                </form>
            </section>

            <aside class="side-area" aria-label="키티 설정">
                <img src="kitty_sticker_studying.png" alt="" class="side-kitty">

                <section class="setup-panel">
                    <h2>GPT API</h2>
                    <label for="api-key-input">API 키</label>
                    <div class="key-row">
                        <input id="api-key-input" type="password" autocomplete="off" placeholder="sk-...">
                        <button id="save-key-btn" type="button">저장</button>
                        <button id="clear-key-btn" type="button">삭제</button>
                    </div>

                    <label for="model-select">모델</label>
                    <select id="model-select">
                        <option value="gpt-5.4-mini">gpt-5.4-mini</option>
                        <option value="gpt-5.5">gpt-5.5</option>
                        <option value="gpt-5.4-nano">gpt-5.4-nano</option>
                    </select>

                    <label for="endpoint-input">API 주소</label>
                    <input id="endpoint-input" type="url" value="https://api.openai.com/v1/responses">

                    <label for="voice-select">키티 목소리</label>
                    <div class="voice-row">
                        <select id="voice-select">
                            <option value="">자동 선택</option>
                        </select>
                        <button id="load-voices-btn" type="button">불러오기</button>
                        <button id="test-voice-btn" type="button">테스트</button>
                    </div>

                    <label for="voice-style-select">말투</label>
                    <select id="voice-style-select">
                        <option value="cute">귀엽게</option>
                        <option value="soft">차분하게</option>
                        <option value="slow">천천히</option>
                    </select>

                    <p class="note">GitHub Pages에서는 키를 코드에 넣지 말고, 이 칸에만 입력하세요. 실제 서비스는 별도 프록시 서버가 더 안전합니다.</p>
                </section>

                <section class="quick-panel">
                    <h2>빠른 말</h2>
                    <div class="quick-buttons">
                        <button type="button" data-prompt="힌트 하나만 더 줘">힌트 더</button>
                        <button type="button" data-prompt="내 풀이가 맞는지 봐줘">풀이 확인</button>
                        <button type="button" data-prompt="다른 방법으로 설명해줘">다른 방법</button>
                    </div>
                </section>

                <section class="promise-panel">
                    <h2>키티의 약속</h2>
                    <ul>
                        <li>정답보다 생각 순서를 먼저 볼게.</li>
                        <li>한 번에 한 걸음씩 힌트를 줄게.</li>
                        <li>사진 속 문제도 차근차근 읽어볼게.</li>
                    </ul>
                </section>
            </aside>
        </main>
    </div>

    <script src="script_isoo.js?v=10"></script>
</body>
</html>
